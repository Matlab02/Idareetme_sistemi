nction statusText(s){return{NEW:'Yeni',PRICING:'Qiymət hazırlanır',QUOTATION_SENT:'Təklif göndərilib',WAITING_CUSTOMER:'Müştəri gözlənilir',ACTIVE:'Aktiv',COMPLETED:'Tamamlandı',REJECTED:'İmtina edildi'}[s]||s}function badge(s){let c=s==='ACTIVE'?'active':s==='PRICING'?'pricing':s==='QUOTATION_SENT'?'sent':'';return`<span class="badge ${c}">${statusText(s)}</span>`}function nav(){document.querySelectorAll('.nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let n=$('#requestCount');n.textContent=db.requests.length||'';n.style.float='right'}function shell(t,d,a=''){return`<div class="content"><div class="head"><div><div class="eyebrow">TƏCHİZAT İDARƏETMƏ</div><h1>${t}</h1><p>${d}</p></div>${a}</div>`}
function currentUserName(){try{const s=JSON.parse(sessionStorage.getItem('erp-auth-session')||'null');return s?.username||'İstifadəçi adı'}catch{return'İstifadəçi adı'}}function dashboard(){let active=db.requests.filter(r=>r.status==='ACTIVE').length,waiting=db.requests.filter(r=>r.status==='WAITING_CUSTOMER').length,sales=db.sales.reduce((a,x)=>a+x.total,0),purchases=db.purchases.reduce((a,x)=>a+x.total,0),profit=db.sales.reduce((a,x)=>a+x.profit,0),critical=db.products.filter(x=>x.stock<=x.min).length;return shell('Sabahınız xeyir, '+currentUserName(),'Təchizat prosesinizin canlı icmalı.',`<button class="primary" onclick="openRequest()">＋ Yeni sorğu</button>`)+`<section class="cards"><div class="card"><label>Aktiv sorğular</label><div class="num">${active}<span class="change">canlı</span></div></div><div class="card"><label>Gözləmədə olanlar</label><div class="num">${waiting}<span class="change">müştəri</span></div></div><div class="card"><label>Bu ay satış</label><div class="num">${money(sales)}<span class="change">↗</span></div></div><div class="card"><label>Bu ay alış</label><div class="num">${money(purchases)}<span class="change">↗</span></div></div><div class="card"><label>Ümumi mənfəət</label><div class="num">${money(profit)}<span class="change">real</span></div></div><div class="card"><label>Kritik stoklar</label><div class="num danger">${critical}<span class="change danger">Diqqət</span></div></div></section><section class="grid"><div class="panel"><h2>Satış dinamikası</h2><p>Son 6 ay üzrə ümumi gəlir</p><div class="chart"><i></i></div></div><div class="panel"><h2>Sorğuların statusu</h2><p>${db.requests.length} qeyd</p><div class="status">${[['Yeni','NEW'],['Qiymət hazırlanır','PRICING','violet'],['Müştəri gözlənilir','WAITING_CUSTOMER','amber'],['Aktiv','ACTIVE','green']].map(([n,s,c])=>`<div><span>${n}</span><b>${db.requests.filter(r=>r.status===s).length}</b><i class="${c||''}"><b style="width:${Math.max(5,db.requests.filter(r=>r.status===s).length*20)} function requests(){let list=db.requests.filter(r=>JSON.stringify(r).toLowerCase().includes(filter.toLowerCase()));return shell('Bütün sorğular','Qiymət, təklif və sifariş proseslərini buradan izləyin.',`<button class="primary" onclick="openRequest()">＋ Yeni sorğu</button>`)+`<div class="toolbar"><input id="requestSearch" value="${esc(filter)}" placeholder="Sorğu, müştəri və ya məhsul axtar..." oninput="filter=this.value;render()"><button class="secondary" onclick="exportRequests()">Export CSV</button></div><div class="panel table-wrap"><table class="tbl"><thead><tr><th>Sorğu</th><th>Müştəri</th><th>Məhsullar</th><th>Status</th><th>Prioritet</th><th>Son fəaliyyət</th><th>Əməliyyat</th></tr></thead><tbody>${list.map(r=>`<tr><td><span class="link" onclick="detail('${r.id}')">${r.id}</span></td><td>${esc(r.customer)}</td><td>${r.items.length} məhsul</td><td>${badge(r.status)}</td><td>${r.priority}</td><td>${r.created}</td><td><select onchange="changeStatus('${r.id}',this.value)"><option value="">Status dəyiş</option>${['PRICING','QUOTATION_SENT','WAITING_CUSTOMER','ACTIVE','COMPLETED','REJECTED'].map(s=>`<option value="${s}">${statusText(s)}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Uyğun sorğu tapılmadı.</td></tr>'}</tbody></table></div></div>`}
function simplePage(kind,title,description,cols){let data=db[kind],heads=cols.map(x=>`<th>${x}</th>`).join('');return shell(title,description,`<button class="primary" onclick="openSimple('${kind}')">＋ Əlavə et</button>`)+`<div class="panel table-wrap" style="margin-top:20px"><table class="tbl"><thead><tr>${heads}<th>Əməliyyat</th></tr></thead><tbody>${data.map((x,i)=>`<tr><td><b>${typeof x==='string'?esc(x):esc(x.name)}</b></td>${kind==='products'?`<td>${x.sku}</td><td>${x.stock}</td><td>${x.min}</td><td>${money(x.cost)}</td>`:'<td>Aktiv</td><td>Əməliyyatlar hazırdır</td>'}<td><button class="secondary" onclick="removeSimple('${kind}',${i})">Arxiv</button></td></tr>`).join('')||'<tr><td class="empty" colspan="6">Hələ qeyd yoxdur.</td></tr>'}</tbody></table></div></div>`}function customers(){return simplePage('customers','Müştərilər','Şirkətlər və biznes tarixçəsi.',['Şirkət','Status','Əlaqə'])}function suppliers(){return simplePage('suppliers','Təchizatçılar','Qiymət, alış və çatdırılma məlumatları.',['Şirkət','Status','Əlaqə'])}function products(){return simplePage('products','Məhsullar','SKU, vahid, tədarükçü və stok qalıqları.',['Məhsul','SKU','Qalıq','Min. stok','Orta maya'])}function stock(){return shell('Anbar qalığı','Lot, FIFO və hərəkət izlənməsi.',`<button class="primary" onclick="openProduct()">＋ Stok girişi</button>`)+`<div class="panel table-wrap" style="margin-top:20px"><table class="tbl"><thead><tr><th>Məhsul</th><th>SKU</th><th>Mövcud</th><th>Min.</th><th>Vəziyyət</th><th>Əməliyyat</th></tr></thead><tbody>${db.products.map((p,i)=>`<tr><td><b>${esc(p.name)}</b></td><td>${p.sku}</td><td>${p.stock}</td><td>${p.min}</td><td>${p.stock<=p.min?'<span class="badge">Kritik</span>':'<span class="badge active">Normal</span>'}</td><td><button class="secondary" onclick="adjustStock(${i})">Düzəliş</button></td></tr>`).join('')}</tbody></table></div></div>`}function orders(kind,title){let data=db[kind];return shell(title,'Təsdiqlənmiş əməliyyatlar və maliyyə göstəriciləri.')+`<div class="panel table-wrap" style="margin-top:20px"><table class="tbl"><thead><tr><th>Nömrə</th><th>Tərəf</th><th>Məbləğ</th><th>Mənfəət</th><th>Status</th></tr></thead><tbody>${data.map(x=>`<tr><td><b>${x.id}</b></td><td>${esc(x.party)}</td><td>${money(x.total)}</td><td>${money(x.profit||0)}</td><td><span class="badge active">Təsdiqləndi</span></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Hələ əməliyyat yoxdur. Sorğunu AKTİV etdikdə satış sifarişi yaranır.</td></tr>'}</tbody></table></div></div>`}function ai(){return shell('AI Mərkəzi','Mətndən məhsul və miqdarları çıxarın; nəticə yalnız təsdiqdən sonra sorğuya çevrilir.')+`<div class="panel" style="margin-top:20px"><div class="drop"><b>AI mətn importu</b><p>Misal: Bolt M12 — 5000 ədəd</p><textarea id="aiText" style="width:min(700px,100%);min-height:125px;border:1px solid #dacdf6;border-radius:9px;padding:10px;font:inherit" placeholder="ABC Construction&#10;Bolt M12 — 5000 ədəd&#10;Nut M12 — 5000 ədəd"></textarea><br><button class="primary violet" style="margin-top:12px" onclick="parseAI()">✦ Məlumatı çıxar</button></div><div id="aiResult"></div><p class="muted">95%+ avtomatik təklif edilir; siz təsdiqləmədən heç bir məlumat yaradılmır.</p></div></div>`}function generic(title){return shell(title,'Bu modul üçün lokal idarəetmə görünüşü.')+`<div class="panel empty" style="margin-top:20px">Bu prototype-da əsas əməliyyat modulları aktivdir: Sorğular, Müştərilər, Təchizatçılar, Məhsullar, Anbar, Alış/Satış və AI import.</div></div>`}function render(){let out={dash:dashboard,requests,customers,suppliers,products,stock,ai,purchase:()=>orders('purchases','Alış sifarişləri'),sales:()=>orders('sales','Satış sifarişləri'),documents:()=>generic('Sənədlər'),reports:()=>generic('Hesabatlar'),settings:()=>generic('Parametrlər')}[page]||dashboard;$('#root').innerHTML=out();nav()}
function modal(html){let d=document.createElement('div');d.className='modal-bg';d.innerHTML=`<div class="modal">${html}</div>`;d.onclick=e=>{if(e.target===d)d.remove()};document.body.append(d)}function closeModal(){document.querySelector('.modal-bg')?.remove()}function openRequest(prefill={}){modal(`<h2>Yeni sorğu</h2><p class="muted">Sorğunu yaradın; sonradan eyni sorğuya yeni məhsul əlavə edə bilərsiniz.</p><form id="requestForm" class="form"><div class="field"><label>Müştəri</label><input name="customer" required value="${esc(prefill.customer||'')}" placeholder="ABC Construction"></div><div class="field"><label>Prioritet</label><select name="priority"><option>Normal</option><option>Yüksək</option><option>Təcili</option></select></div><div class="field full"><label>Məhsullar — hər sətir: ad | miqdar | vahid | alış | satış</label><textarea name="items" required placeholder="Bolt M12 | 5000 | ədəd | 0.13 | 0.18">${esc(prefill.items||'')}</textarea></div><div class="field full"><label>Qeyd</label><textarea name="note">${esc(prefill.note||'')}</textarea></div><div class="field"><label>Başlanğıc status</label><select name="status"><option value="NEW">Yeni</option><option value="PRICING">Qiymət hazırlanır</option></select></div></form><div class="actions"><button class="secondary" onclick="closeModal()">Ləğv et</button><button class="primary" onclick="saveRequest()">Sorğunu yarat</button></div>`)}function saveRequest(){let v=Object.fromEntries(new FormData($('#requestForm'))),items=v.items.split('\n').filter(Boolean).map(line=>{let[name,qty,unit,cost,sale]=line.split('|').map(x=>x.trim());return{name,qty:Number(qty),unit:unit||'ədəd',cost:Number(cost)||0,sale:Number(sale)||0}});if(!v.customer||!items.length||items.some(x=>!x.name||!x.qty))return toast('Müştəri və düzgün məhsul sətirləri məcburidir.');let id='SR-'+new Date().getFullYear()+'-'+String(Date.now()).slice(-5);db.requests.unshift({id,customer:v.customer,items,status:v.status,priority:v.priority,note:v.note,created:'İndi',timeline:['Sorğu yaradıldı']});if(!db.customers.includes(v.customer))db.customers.push(v.customer);audit('CREATE',id);save();closeModal();page='requests';render();toast(`${id} yaradıldı`)}function detail(id){let r=db.requests.find(x=>x.id===id);modal(`<h2>${r.id}</h2><p>${esc(r.customer)} · ${badge(r.status)} · ${r.priority}</p><div class="form"><div class="field full"><label>Qeyd</label><textarea id="detailNote">${esc(r.note)}</textarea></div><div class="field"><label>Status</label><select id="detailStatus">${['NEW','PRICING','QUOTATION_SENT','WAITING_CUSTOMER','ACTIVE','COMPLETED','REJECTED'].map(s=>`<option ${s===r.status?'selected':''} value="${s}">${statusText(s)}</option>`).join('')}</select></div></div><h3>Məhsullar</h3><table class="tbl"><thead><tr><th>Məhsul</th><th>Miqdar</th><th>Maya</th><th>Satış</th></tr></thead><tbody>${r.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty} ${i.unit}</td><td>${i.cost}</td><td>${i.sale}</td></tr>`).join('')}</tbody></table><div class="timeline">${r.timeline.map(x=>`<div><b>${esc(x)}</b><span class="muted">İndi</span></div>`).join('')}</div><div class="actions"><button class="secondary" onclick="closeModal()">Bağla</button><button class="primary" onclick="saveDetail('${id}')">Dəyişiklikləri saxla</button></div>`)}function activate(r){if(r.status==='ACTIVE'||db.sales.some(x=>x.request===r.id))return;r.status='ACTIVE';let total=r.items.reduce((a,i)=>a+i.qty*i.sale,0),cost=r.items.reduce((a,i)=>a+i.qty*i.cost,0);db.sales.push({id:'SO-'+r.id.slice(3),request:r.id,party:r.customer,total,profit:total-cost});r.timeline.push('Təklif qəbul edildi və satış sifarişi yaradıldı')}function saveDetail(id){let r=db.requests.find(x=>x.id===id);r.note=$('#detailNote').value;let s=$('#detailStatus').value;if(s!==r.status){r.status=s;r.timeline.push('Status dəyişdi: '+statusText(s));if(s==='ACTIVE')activate(r)}audit('UPDATE',id);save();closeModal();render();toast('Sorğu yeniləndi')}function changeStatus(id,s){if(!s)return;let r=db.requests.find(x=>x.id===id);r.status=s;r.timeline.push('Status dəyişdi: '+statusText(s));if(s==='ACTIVE')activate(r);audit('STATUS_CHANGE',id);save();render();toast('Status dəyişdirildi')}
function openProduct(){modal(`<h2>Stok əməliyyatı</h2><form id="productForm" class="form"><div class="field"><label>Məhsul adı</label><input name="name" required></div><div class="field"><label>SKU</label><input name="sku" required></div><div class="field"><label>Giriş miqdarı</label><input name="stock" type="number" required></div><div class="field"><label>Minimum stok</label><input name="min" type="number" value="0"></div><div class="field"><label>Vahid maya</label><input name="cost" type="number" step=".01" value="0"></div></form><div class="actions"><button class="secondary" onclick="closeModal()">Ləğv</button><button class="primary" onclick="saveProduct()">Stoka əlavə et</button></div>`)}function saveProduct(){let v=Object.fromEntries(new FormData($('#productForm')));if(!v.name||!v.sku||!Number(v.stock))return toast('Məhsul, SKU və miqdar məcburidir.');db.products.push({name:v.name,sku:v.sku,stock:Number(v.stock),min:Number(v.min),cost:Number(v.cost)});audit('STOCK_IN',v.sku);save();closeModal();page='stock';render();toast('Stok girişi qeydə alındı')}function adjustStock(i){let q=Number(prompt('Yeni stok qalığı:',db.products[i].stock));if(Number.isFinite(q)&&q>=0){db.products[i].stock=q;audit('STOCK_ADJUSTMENT',db.products[i].sku);save();render();toast('Stok yeniləndi')}}function openSimple(kind){if(kind==='products')return openProduct();modal(`<h2>Yeni qeyd</h2><form id="simpleForm" class="form"><div class="field full"><label>Ad</label><input name="name" required placeholder="Şirkət adı"></div></form><div class="actions"><button class="secondary" onclick="closeModal()">Ləğv</button><button class="primary" onclick="saveSimple('${kind}')">Saxla</button></div>`)}function saveSimple(kind){let name=$('#simpleForm [name=name]').value.trim();if(!name)return;db[kind].push(name);audit('CREATE',name);save();closeModal();render();toast('Qeyd əlavə edildi')}function removeSimple(kind,i){db[kind].splice(i,1);audit('ARCHIVE',kind);save();render();toast('Qeyd arxivləndi')}
function parseAI(){let lines=$('#aiText').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!lines.length)return toast('Emal üçün mətn yazın.');let customer=lines[0].includes('—')?'':lines.shift(),items=lines.map(x=>{let m=x.match(/(.+?)(?:\s*[—-]\s*|\s+)([\d,.]+)\s*(ədəd|pcs|kq|kg|metr|m|litr|l)?$/i);return m?{name:m[1].trim(),qty:Number(m[2].replace(',','.')),unit:m[3]||'ədəd',confidence:Math.floor(88+Math.random()*11)}:null}).filter(Boolean);let pre=encodeURIComponent(JSON.stringify({customer,items:items.map(i=>`${i.name} | ${i.qty} | ${i.unit} | 0 | 0`).join('\n')}));$('#aiResult').innerHTML=items.length?`<div class="result"><b>Çıxarılmış nəticə · İnsan təsdiqi gözlənilir</b><table class="tbl"><tbody>${items.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty} ${x.unit}</td><td>${x.confidence}%</td></tr>`).join('')}</tbody></table><button class="primary violet" data-pre="${pre}" onclick="confirmAI(this.dataset.pre)">Sorğu kimi təsdiqlə</button></div>`:'<div class="result">Məhsul və miqdar formatı tanınmadı.</div>'}function confirmAI(x){openRequest(JSON.parse(decodeURIComponent(x)))}function exportRequests(){let csv='Nömrə,Müştəri,Status,Prioritet\n'+db.requests.map(r=>[r.id,r.customer,statusText(r.status),r.priority].map(x=>'"'+x+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='sorgular.csv';a.click();URL.revokeObjectURL(a.href);toast('CSV export hazırlandı')}$('#globalSearch').oninput=e=>{filter=e.target.value;page='requests';render()};$('#aiQuick').onclick=()=>{page='ai';render()};$('#theme').onclick=()=>{document.body.classList.toggle('dark');toast('Tema dəyişdirildi')};$('#bell').onclick=()=>toast(db.audit.length?`Son əməliyyat: ${db.audit[0].action}`:'Yeni bildiriş yoxdur');document.querySelectorAll('.nav button[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;filter='';render()});render();
</script><script>window.audit=function(action,entity){db.audit.unshift({action,entity,time:new Date().toLocaleString('az-AZ'),user:typeof currentUserName==='function'?currentUserName():'İstifadəçi'});save()};</script><script src="todo-module.js?v=todo6"></script><script src="todo-live.js?v=todo-live2"></script><script src="erp-user-migration.js?v=erp-migrate2"></script><script src="request-additional-documents.js?v=additional-docs3"></script><script src="request-create-upload-ui.js?v=create-upload2"></script><script src="request-navigation-state.js?v=nav-state1"></script><script src="vendor/jszip.min.js?v=3.10.2"></script><script src="request-official-documents.js?v=official-docs12"></script><script src="request-number.js?v=pr1"></script></body></html>
